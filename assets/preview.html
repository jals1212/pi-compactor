<!doctype html>
<!-- Source of assets/preview.png, the Pi package gallery preview (package.json pi.image).
     Regenerate on macOS: qlmanage -t -s 1280 -o <dir> assets/preview.html, then
     sips -c 640 1280 <dir>/preview.html.png --out assets/preview.png
     (Quick Look renders a 1000px square page: the image is the band in its middle, hence the zoom and margin below).
     Look: an industrial press. Near-black steel, one safety yellow with hazard stripes: a ram comes down on a stack
     of conversation blocks and leaves a thin slab engraved "## Handoff"; the gauge reads the 70% soft threshold. -->
<html>
<head>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { width: 100%; height: 1000px; overflow: hidden; background: #15181c; }
  body { zoom: 0.78125; }
  body { width: 1280px; height: 640px; margin-top: 320px; }
  body {
    color: #e6e8ea;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; gap: 40px; padding: 0 64px 0 72px;
  }
  .left { width: 470px; flex: none; }
  .rule { height: 14px; width: 150px; background: repeating-linear-gradient(-45deg, #f5b800 0 12px, #15181c 12px 24px); }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; margin-top: 22px; white-space: nowrap; }
  p { font-size: 25px; line-height: 1.38; color: #8a96a3; margin-top: 18px; }
  p b { color: #e6e8ea; font-weight: 600; }
  .tags { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tags span { font: 600 17px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #e6e8ea;
    background: #1e232a; border: 1px solid #8a96a3; border-radius: 4px; padding: 9px 14px; }
  .tags span.hot { color: #15181c; background: #f5b800; border-color: #f5b800; }
  svg { flex: none; display: block; }
</style>
</head>
